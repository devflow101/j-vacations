[build]
  command = "npm run netlify-build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NEXT_TELEMETRY_DISABLED = "1"

# Disable cache temporarily to ensure fresh build
[build.processing]
  skip_processing = false

# Function settings for Next.js
[functions]
  node_bundler = "esbuild"

# Specify the branch to deploy
[context.production]
  base = "/"

# Cache settings
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle static files
[[redirects]]
  from = "/_next/static/*"
  to = "/static/:splat"
  status = 200

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 